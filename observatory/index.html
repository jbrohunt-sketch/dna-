<!doctype html>
<html lang="en" data-tone="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07110e">
<meta name="description" content="Astervell — The Observatory. Describe one workflow that keeps slipping and receive a draft observation: the workflow, the evidence, and one reversible test.">
<title>Astervell — The Observatory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ------------------------------------------------------------------
   Tokens — Astervell palette (paper, pine, ink) with a night register
   for the observatory scenes.
------------------------------------------------------------------- */
:root {
  --paper: #f4f1e8;
  --paper-bright: #fbfaf5;
  --paper-deep: #e7eadc;
  --ink: #10231f;
  --muted: #5a6762;
  --faint: #99a39e;
  --line: rgba(11, 61, 50, .16);
  --line-soft: rgba(11, 61, 50, .09);
  --pine: #0b3d32;
  --pine-dark: #0c231e;
  --night: #07110e;
  --night-2: #0b1a16;
  --star: #f4f1e8;
  --coral: #c8644e;
  --gold: #b08a4a;
  --gold-soft: rgba(176, 138, 74, .38);
  --gold-bright: #dfc27f;
  --mint: #bfe8cb;
  --blue: #a8cfd1;
  --on-night: #efeadc;
  --on-night-muted: rgba(239, 234, 220, .62);
  --on-night-faint: rgba(239, 234, 220, .34);
  --night-line: rgba(239, 234, 220, .14);

  --serif: "Instrument Serif", "Iowan Old Style", Baskerville, "Palatino Linotype", Georgia, serif;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --ease: cubic-bezier(.2, .7, .3, 1);
  --ease-out: cubic-bezier(.22, .7, .22, 1);
  --spring: cubic-bezier(.34, 1.4, .5, 1);
  --shadow-card: 0 1px 2px rgba(14, 29, 25, .05), 0 24px 60px -28px rgba(14, 29, 25, .35);
  --shadow-float: 0 2px 6px rgba(0, 0, 0, .2), 0 40px 90px -30px rgba(0, 0, 0, .7);
  --gutter: 20px;
  --radius: 28px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font: 400 16px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
[tabindex="-1"]:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ------------------------------------------------------------------
   Device frame: full-bleed on phones, a floating instrument on desktop
------------------------------------------------------------------- */
.backdrop {
  position: fixed; inset: 0;
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(176, 138, 74, .10), transparent 60%),
    radial-gradient(900px 600px at 50% 120%, rgba(11, 61, 50, .55), transparent 60%),
    var(--night);
}
.backdrop-copy { display: none; }
#app {
  position: relative;
  width: 100%;
  height: 100dvh;
  margin: 0 auto;
  overflow: hidden;
  overflow: clip;
  isolation: isolate;
  background: var(--night);
  transition: background .9s var(--ease);
}
html[data-tone="paper"] #app { background: var(--paper); }
@media (min-width: 720px) and (min-height: 700px) {
  body { display: grid; place-items: center; }
  #app {
    width: 420px;
    height: min(880px, calc(100dvh - 56px));
    border-radius: 44px;
    box-shadow: 0 0 0 1px rgba(239, 234, 220, .08), 0 0 0 10px #050c0a, 0 0 0 11px rgba(239, 234, 220, .1), var(--shadow-float);
  }
  .backdrop-copy {
    display: block; position: fixed; left: 48px; bottom: 44px; max-width: 260px;
    color: var(--on-night-faint); font: 400 12px/1.6 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  }
  .backdrop-copy b { display: block; color: var(--on-night-muted); font: 400 28px/1.1 var(--serif); letter-spacing: 0; text-transform: none; margin-bottom: 10px; }
}

/* Film grain for tactility */
.grain {
  position: absolute; inset: -50%; z-index: 50; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
html[data-tone="paper"] .grain { opacity: .05; mix-blend-mode: multiply; }

/* Sky: persists across scenes so night transitions feel continuous */
#sky { position: absolute; inset: 0; z-index: 0; pointer-events: none; transition: opacity 1.1s var(--ease); }
html[data-tone="paper"] #sky { opacity: 0; }
#sky svg { width: 100%; height: 100%; display: block; }
#sky .st { fill: var(--star); animation: twinkle var(--d, 5s) ease-in-out var(--dl, 0s) infinite; }
@keyframes twinkle { 0%, 100% { opacity: var(--o, .5); } 50% { opacity: calc(var(--o, .5) * .25); } }
#sky .horizon {
  position: absolute; left: -20%; right: -20%; bottom: -38%; height: 70%;
  background: radial-gradient(closest-side, rgba(11, 61, 50, .9), rgba(11, 61, 50, 0));
}

/* ------------------------------------------------------------------
   Scenes
------------------------------------------------------------------- */
#stage { position: absolute; inset: 0; z-index: 1; }
.scene {
  position: absolute; inset: 0;
  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: calc(env(safe-area-inset-top) + 18px) var(--gutter) calc(env(safe-area-inset-bottom) + 28px);
  opacity: 0; transform: translate3d(calc(var(--dir, 1) * 28px), 0, 0);
  transition: opacity .6s var(--ease), transform .7s var(--ease);
  scrollbar-width: none;
}
.scene::-webkit-scrollbar { display: none; }
.scene.in { opacity: 1; transform: none; }
.scene.out { opacity: 0; transform: translate3d(calc(var(--dir, 1) * -28px), 0, 0); pointer-events: none; }
.scene[data-tone="night"] { color: var(--on-night); }

/* staged entrance used everywhere: set --i on children */
.rise { opacity: 0; transform: translateY(14px); }
.pop-in { animation: rise .8s var(--ease) calc(var(--i, 0) * 90ms) both; }
.scene.in .rise { animation: rise .9s var(--ease) calc(var(--i, 0) * 90ms + 120ms) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ------------------------------------------------------------------
   Type
------------------------------------------------------------------- */
.eyebrow { font: 500 11px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.scene[data-tone="night"] .eyebrow { color: var(--on-night-muted); }
.display { font: 400 clamp(44px, 12vw, 54px)/.98 var(--serif); letter-spacing: -.01em; margin: 0; }
.display em, .title em { font-style: italic; color: var(--gold); }
.title { font: 400 clamp(32px, 9vw, 38px)/1.04 var(--serif); letter-spacing: -.005em; margin: 0; }
.lede { font: 400 16px/1.55 var(--sans); color: var(--muted); margin: 0; }
.scene[data-tone="night"] .lede { color: var(--on-night-muted); }
.fine { font: 400 12.5px/1.55 var(--sans); color: var(--faint); margin: 0; }
.scene[data-tone="night"] .fine { color: var(--on-night-faint); }
.num { font: 400 11px/1 var(--mono); letter-spacing: .1em; color: var(--faint); }

/* ------------------------------------------------------------------
   Controls
------------------------------------------------------------------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; min-height: 58px; padding: 0 24px; border-radius: 999px;
  font: 500 16px/1 var(--sans); letter-spacing: -.005em;
  transition: transform .25s var(--ease), background .3s var(--ease), opacity .3s, box-shadow .3s;
}
.btn:active { transform: scale(.975); }
.btn-primary { background: var(--pine); color: var(--paper-bright); box-shadow: 0 10px 30px -12px rgba(11, 61, 50, .7); }
.btn-light { background: var(--paper); color: var(--ink); box-shadow: 0 10px 40px -14px rgba(244, 241, 232, .35); }
.btn-ghost { color: inherit; border: 1px solid var(--line); background: transparent; }
.scene[data-tone="night"] .btn-ghost { border-color: var(--night-line); }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn .arrow { transition: transform .3s var(--ease); }
.btn:hover .arrow { transform: translateX(3px); }
.link { color: inherit; text-decoration: underline; text-decoration-color: var(--gold-soft); text-underline-offset: 3px; }
.iconbtn {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--line); background: rgba(251, 250, 245, .6); backdrop-filter: blur(8px);
  transition: transform .2s var(--ease);
}
.iconbtn:active { transform: scale(.92); }
.scene[data-tone="night"] .iconbtn { border-color: var(--night-line); background: rgba(239, 234, 220, .04); }
.iconbtn .emblem { width: 28px; height: 28px; }
.iconbtn .emblem circle { fill: var(--paper-bright); }
.iconbtn svg:not(.emblem) { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------------------------------------------
   Emblem + dial
------------------------------------------------------------------- */
.emblem { width: 76px; height: 76px; display: block; }
.emblem path, .emblem circle { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.emblem .draw { stroke-dasharray: var(--len, 160); stroke-dashoffset: var(--len, 160); animation: draw 2.2s var(--ease-out) var(--dl, .2s) forwards; }
.emblem circle { fill: var(--night); opacity: 0; animation: pop .6s var(--spring) var(--dl, 1.4s) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
.emblem circle { transform-box: fill-box; transform-origin: center; }

.dial { position: absolute; left: 50%; top: 38%; width: 520px; height: 520px; transform: translate(-50%, -50%); pointer-events: none; opacity: .55; }
.dial svg { width: 100%; height: 100%; animation: spin 180s linear infinite; }
.dial .t { stroke: var(--on-night-faint); stroke-width: 1; }
.dial .t.major { stroke: var(--gold-soft); stroke-width: 1.4; }
.dial .ring { fill: none; stroke: var(--night-line); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------------
   Arrival
------------------------------------------------------------------- */
.arrival { display: flex; flex-direction: column; min-height: 100%; }
.arrival-top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; }
.wordmark { font: 400 22px/1 var(--serif); letter-spacing: .01em; }
.wordmark small { display: block; margin-top: 4px; font: 400 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--on-night-faint); }
.arrival-hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; padding: 40px 0 24px; }
.arrival-hero .emblem { color: var(--on-night); margin-bottom: 34px; position: relative; z-index: 1; }
.arrival-hero .display { position: relative; z-index: 1; }
.arrival-hero .lede { max-width: 320px; margin-top: 20px; position: relative; z-index: 1; }
.arrival-foot { display: grid; gap: 14px; position: relative; z-index: 2; }
.meta-row { display: flex; justify-content: center; gap: 18px; color: var(--on-night-faint); font: 400 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.meta-row span::before { content: ""; display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); margin-right: 8px; vertical-align: middle; }

/* ------------------------------------------------------------------
   Intake — one question per screen
------------------------------------------------------------------- */
.intake { display: flex; flex-direction: column; min-height: 100%; }
.intake-bar { display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 3; padding-bottom: 12px; }
.progress { flex: 1; display: flex; gap: 4px; }
.progress i { flex: 1; height: 3px; border-radius: 3px; background: var(--line-soft); overflow: hidden; position: relative; }
.progress i::after { content: ""; position: absolute; inset: 0; background: var(--pine); transform: scaleX(0); transform-origin: left; transition: transform .6s var(--ease); }
.progress i.done::after { transform: scaleX(1); }
.progress i.now::after { transform: scaleX(.45); }
.intake-count { min-width: 52px; text-align: right; }
.q-wrap { flex: 1; position: relative; display: grid; }
.q { grid-area: 1 / 1; display: flex; flex-direction: column; padding-top: 7vh; transition: opacity .45s var(--ease), transform .55s var(--ease); }
.q.enter { opacity: 0; transform: translateY(calc(var(--qdir, 1) * 34px)); }
.q.leave { opacity: 0; transform: translateY(calc(var(--qdir, 1) * -24px)); pointer-events: none; }
.q-kicker { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.q-kicker::before { content: ""; width: 18px; height: 1px; background: var(--gold); }
.q h2 { margin-bottom: 12px; }
.q .lede { margin-bottom: 30px; font-size: 15px; }
.opts { display: grid; gap: 10px; }
.opt {
  position: relative; display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
  padding: 17px 18px; min-height: 64px; border-radius: 20px;
  background: var(--paper-bright); border: 1px solid var(--line-soft);
  box-shadow: 0 1px 2px rgba(14, 29, 25, .04);
  transition: transform .25s var(--ease), border-color .3s, background .3s, box-shadow .3s;
  opacity: 0; animation: rise .7s var(--ease) calc(var(--i, 0) * 60ms + 160ms) both;
}
.opt:hover { border-color: var(--line); }
.opt:active { transform: scale(.985); }
.opt .key {
  flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
  font: 500 11px/1 var(--mono); color: var(--muted); border: 1px solid var(--line);
  transition: all .3s var(--ease);
}
.opt.multi .key { border-radius: 50%; }
.opt b { display: block; font: 500 16px/1.25 var(--sans); letter-spacing: -.01em; }
.opt small { display: block; margin-top: 3px; font: 400 13px/1.35 var(--sans); color: var(--muted); }
.opt[aria-checked="true"], .opt[aria-pressed="true"] { border-color: var(--pine); background: #fff; box-shadow: 0 0 0 1px var(--pine), 0 12px 30px -18px rgba(11, 61, 50, .6); }
.opt[aria-checked="true"] .key, .opt[aria-pressed="true"] .key { background: var(--pine); border-color: var(--pine); color: var(--paper-bright); }
.opt.chosen { animation: chosen .5s var(--ease) both; }
@keyframes chosen { 0% { opacity: 1; } 40% { opacity: 1; transform: scale(.975); } 100% { opacity: 1; transform: none; } }
.opts.settling .opt:not([aria-checked="true"]) { animation: dim .4s var(--ease) both; }
@keyframes dim { from { opacity: 1; } to { opacity: .35; } }
.q-actions { margin-top: auto; padding-top: 28px; display: grid; gap: 10px; }
.field {
  width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent;
  font: 400 34px/1.2 var(--serif); padding: 8px 0 12px; color: var(--ink); border-radius: 0;
  transition: border-color .3s;
}
.field:focus { outline: none; border-color: var(--pine); }
.field::placeholder { color: var(--faint); }
textarea.field { font: 400 24px/1.35 var(--serif); resize: none; min-height: 150px; }
.guard { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; padding: 14px 16px; border-radius: 16px; background: var(--paper-deep); }
.guard svg { flex: none; width: 16px; height: 16px; margin-top: 2px; stroke: var(--pine); fill: none; stroke-width: 1.6; }
.count { text-align: right; margin-top: 6px; }

/* ------------------------------------------------------------------
   Composing — the curated pause
------------------------------------------------------------------- */
.composing { display: flex; flex-direction: column; min-height: 100%; }
.orbit { position: relative; width: min(300px, 78vw); aspect-ratio: 1; margin: 5vh auto 0; }
.orbit svg { width: 100%; height: 100%; overflow: visible; }
.orbit .rg { fill: none; stroke: var(--night-line); }
.orbit .rg.dash { stroke-dasharray: 2 6; }
.orbit .spin { transform-origin: 150px 150px; animation: spin 26s linear infinite; }
.orbit .spin.rev { animation-duration: 40s; animation-direction: reverse; }
.orbit .node { transition: transform 1.6s var(--ease), opacity 1.2s var(--ease); transform-box: view-box; transform-origin: 150px 150px; }
.orbit .node circle { fill: var(--night); stroke: var(--on-night); stroke-width: 1.4; }
.orbit .node text { fill: var(--on-night-muted); font: 400 8.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.orbit.converge .node { transform: scale(.02); opacity: 0; }
.orbit .core { fill: var(--gold); transform-origin: 150px 150px; transform: scale(.4); transition: transform 1.4s var(--spring) .5s; }
.orbit.converge .core { transform: scale(1.35); }
.orbit .pulse { fill: none; stroke: var(--gold); opacity: 0; transform-origin: 150px 150px; }
.orbit.converge .pulse { animation: pulse 2.4s var(--ease-out) .9s infinite; }
@keyframes pulse { from { opacity: .7; transform: scale(.5); } to { opacity: 0; transform: scale(3.2); } }
.steps-log { list-style: none; margin: 34px 0 0; padding: 0; display: grid; gap: 14px; }
.steps-log li { display: flex; gap: 14px; align-items: center; font: 400 15px/1.35 var(--sans); color: var(--on-night-faint); opacity: 0; transform: translateY(8px); transition: all .7s var(--ease); }
.steps-log li.on { opacity: 1; transform: none; color: var(--on-night); }
.steps-log li.done { color: var(--on-night-muted); }
.steps-log .tick { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--night-line); display: grid; place-items: center; }
.steps-log li.on .tick { border-color: var(--gold); }
.steps-log .tick svg { width: 11px; height: 11px; stroke: var(--gold); fill: none; stroke-width: 2; stroke-dasharray: 14; stroke-dashoffset: 14; transition: stroke-dashoffset .5s var(--ease) .2s; }
.steps-log li.done .tick svg { stroke-dashoffset: 0; }
.steps-log li.on:not(.done) .tick::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .2; } }
.composing .skip { margin-top: auto; align-self: center; padding: 14px 18px; color: var(--on-night-faint); font: 400 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }

/* ------------------------------------------------------------------
   Reveal — the sealed card
------------------------------------------------------------------- */
.reveal { display: flex; flex-direction: column; align-items: center; min-height: 100%; text-align: center; }
.reveal-head { margin-top: 4vh; }
.reveal-head .title { margin-top: 12px; }
.envelope-wrap { perspective: 1400px; margin: 7vh 0 5vh; width: min(310px, 82vw); }
.envelope {
  position: relative; width: 100%; aspect-ratio: 5 / 6.2; border-radius: 22px;
  background: linear-gradient(170deg, var(--paper-bright), var(--paper) 60%, var(--paper-deep));
  box-shadow: var(--shadow-float);
  transform-style: preserve-3d; animation: float 5s ease-in-out infinite;
  transition: transform .9s var(--ease);
}
.envelope::before { content: ""; position: absolute; inset: 10px; border: 1px solid var(--gold-soft); border-radius: 14px; }
@keyframes float { 50% { transform: translateY(-8px) rotate(-.6deg); } }
.env-inner { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; padding: 30px 26px; color: var(--ink); }
.env-inner .eyebrow { color: var(--muted); }
.env-name { font: 400 30px/1.05 var(--serif); }
.env-name em { color: var(--pine); }
.flap {
  position: absolute; left: 0; right: 0; top: 0; height: 52%; transform-origin: top; z-index: 2;
  background: linear-gradient(180deg, #ece8dc, #e4e0d2);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  border-radius: 22px 22px 0 0;
  transition: transform 1s var(--ease);
  backface-visibility: hidden;
}
.seal {
  position: absolute; left: 50%; top: 52%; z-index: 3; width: 74px; height: 74px; margin: -37px 0 0 -37px;
  border-radius: 50%; display: grid; place-items: center; color: var(--paper);
  background: radial-gradient(circle at 35% 30%, #1d5a4b, var(--pine) 55%, #072a22);
  box-shadow: 0 6px 16px -4px rgba(0, 0, 0, .45), inset 0 0 0 3px rgba(255, 255, 255, .06), inset 0 0 0 6px rgba(0, 0, 0, .12);
  transition: transform .8s var(--spring), opacity .5s;
}
.seal .emblem { width: 40px; height: 40px; }
.seal .emblem path, .seal .emblem circle { stroke-width: 3.2; }
.seal .emblem circle { fill: var(--pine); opacity: 1; animation: none; }
.envelope.opening .seal { transform: scale(1.3); opacity: 0; }
.envelope.opening .flap { transform: rotateX(180deg); }
.envelope.opening { transform: translateY(-12px) scale(1.03); animation: none; }
.envelope .hint { position: absolute; bottom: -44px; left: 0; right: 0; color: var(--on-night-faint); font: 400 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; animation: blink 2.4s ease-in-out infinite; }

/* ------------------------------------------------------------------
   Observation — shared pieces (flow, blocks)
------------------------------------------------------------------- */
.obs-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.obs-intro { margin-bottom: 20px; }
.obs-intro .title { margin: 10px 0 10px; }
.card {
  flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always;
  background: var(--paper-bright); border-radius: var(--radius); padding: 24px 22px 26px;
  border: 1px solid var(--line-soft); box-shadow: var(--shadow-card);
}
.card-top { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 14px; margin-bottom: 20px; border-bottom: 1px solid var(--line-soft); }
.card h3 { font: 400 30px/1.05 var(--serif); margin: 0 0 8px; letter-spacing: -.005em; }
.card h3 em { color: var(--pine); }
.card .sub { font: 400 14px/1.5 var(--sans); color: var(--muted); margin: 0 0 22px; }
.flow { list-style: none; margin: 0; padding: 0; position: relative; }
.flow::before { content: ""; position: absolute; left: 13px; top: 14px; bottom: 14px; width: 1px; background: linear-gradient(var(--line), var(--line)); }
.flow li { position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 14px; padding: 0 0 18px; opacity: 0; transform: translateX(-6px); transition: all .6s var(--ease) calc(var(--i) * 80ms); }
.card.seen .flow li { opacity: 1; transform: none; }
.flow .dot { width: 27px; height: 27px; border-radius: 50%; background: var(--paper-bright); border: 1px solid var(--line); display: grid; place-items: center; font: 500 10px/1 var(--mono); color: var(--muted); position: relative; z-index: 1; }
.flow b { display: block; font: 500 15px/1.3 var(--sans); }
.flow small { display: block; font: 400 13px/1.4 var(--sans); color: var(--muted); }
.flow small i { font-style: normal; color: var(--faint); }
.flow li.flag .dot { border-color: var(--coral); color: var(--coral); background: #fff; box-shadow: 0 0 0 5px rgba(200, 100, 78, .12); }
.flow li.flag .dot::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid var(--coral); opacity: .4; animation: pulse-sm 2.6s var(--ease-out) infinite; }
@keyframes pulse-sm { from { transform: scale(.8); opacity: .6; } to { transform: scale(1.6); opacity: 0; } }
.flagnote { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: rgba(200, 100, 78, .08); color: #8e3f2d; font: 400 13px/1.45 var(--sans); }
.block { padding: 16px 0; border-top: 1px solid var(--line-soft); }
.block:first-of-type { border-top: 0; padding-top: 0; }
.block .eyebrow { display: block; margin-bottom: 8px; }
.block p { margin: 0; font: 400 15px/1.55 var(--sans); }
.block p.q-line { font: 400 24px/1.2 var(--serif); }
.block p + p { margin-top: 6px; }
.block .fine { margin-top: 8px; }
.callout { margin-top: 12px; padding: 16px; border-radius: 18px; background: var(--pine); color: var(--paper); }
.callout .eyebrow { color: rgba(244, 241, 232, .6); }
.callout p { margin: 6px 0 0; font: 400 14px/1.5 var(--sans); }
.decide { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.decide span { text-align: center; padding: 12px 0; border-radius: 14px; background: var(--paper-deep); font: 400 20px/1 var(--serif); }
.big-move { font: 400 34px/1.02 var(--serif); margin: 0 0 16px; }
.big-move span { display: block; color: var(--pine); font-style: italic; }
/* ------------------------------------------------------------------
   Observation — explorable handoff model (Explore · Evidence · Test)
------------------------------------------------------------------- */
.scene[data-scene="observation"] {
  padding-bottom: 0;
  background:
    radial-gradient(ellipse at 20% 12%, rgba(38, 62, 49, .9), transparent 55%),
    radial-gradient(ellipse at 85% 95%, rgba(36, 67, 53, .8), transparent 55%),
    #102a24;
}
.obs-shell { display: flex; flex-direction: column; min-height: 100%; }
.obs-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.obs-top .num { color: var(--on-night-faint); text-align: center; }
.obs-view { flex: 1; padding: 8px 0 30px; }
.pane { display: flex; flex-direction: column; }
.center-pane { align-items: stretch; text-align: center; }
.center { text-align: center; }
.intro { margin: 14px 0 8px; }
.intro .lede { margin-top: 8px; }
.scene-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 12px 0 0; }
.chip { padding: 8px 13px; border-radius: 999px; border: 1px solid var(--night-line); font: 500 12px/1 var(--sans); color: var(--on-night); white-space: nowrap; transition: all .3s var(--ease); }
.chip[aria-pressed="true"] { background: var(--gold-bright); color: #253f2a; border-color: transparent; }

.system { position: relative; width: 100%; aspect-ratio: 400 / 360; isolation: isolate; touch-action: pan-y; margin-top: 6px; }
.system .links { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: -1; }
.links path { fill: none; stroke: rgba(168, 185, 163, .22); stroke-width: 1; stroke-dasharray: 3 5; }
.links .active { stroke: var(--gold-bright); stroke-width: 1.6; stroke-dasharray: none; filter: drop-shadow(0 0 5px rgba(223, 194, 127, .45)); }
.links .blocked { stroke: var(--coral); stroke-width: 1.6; stroke-dasharray: 5 5; }
.links .travel { stroke: var(--paper); stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 2 900; stroke-dashoffset: 2; opacity: 0; }
.links .travel.go { animation: travel 2.4s var(--ease) both; }
@keyframes travel { 0% { opacity: 0; stroke-dashoffset: 2; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; stroke-dashoffset: -440; } }
.halo { position: absolute; width: 120px; height: 120px; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
  border: 1px solid rgba(223, 194, 127, .14); box-shadow: 0 0 0 22px rgba(223, 194, 127, .04), 0 0 0 48px rgba(223, 194, 127, .025);
  transition: left .8s var(--ease), top .8s var(--ease); }
.request { position: absolute; transform: translate(-50%, -50%); z-index: 3; text-align: left; padding: 10px 14px; border-radius: 16px;
  background: var(--paper); color: var(--ink); box-shadow: 0 12px 26px -10px rgba(0, 0, 0, .6); rotate: -2deg; transition: rotate .3s var(--ease); }
.request:hover { rotate: 0deg; }
.request small { display: block; font: 500 8.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.request span { font: 400 16px/1.1 var(--serif); }
.person { position: absolute; width: 96px; transform: translate(-50%, -50%); text-align: center; z-index: 4; color: var(--on-night); }
.orb { width: 64px; height: 64px; margin: auto; border-radius: 50%; display: grid; place-items: center; position: relative;
  font: 400 28px/1 var(--serif); color: #143425;
  background: radial-gradient(circle at 30% 25%, #e5edc6 0, #b6cca5 34%, #809c74 70%, #365944 100%);
  box-shadow: inset 1px 2px 3px rgba(248, 255, 230, .4), inset -3px -4px 6px rgba(0, 27, 19, .35), 4px 15px 21px rgba(0, 28, 19, .4), 0 0 0 1px rgba(250, 255, 218, .13);
  transition: transform .5s var(--ease), box-shadow .5s var(--ease), filter .5s, opacity .5s; pointer-events: none; }
.person.owner .orb { width: 84px; height: 84px; font-size: 34px; color: #243d2c; background: radial-gradient(circle at 30% 25%, #f2ddab, #c6b184 38%, #8e805d 76%, #4e573c); }
.person.cover .orb { width: 50px; height: 50px; font-size: 20px; background: radial-gradient(circle at 30% 25%, #bad3c5, #8fac9a 40%, #436e60 90%); }
.person .pname { display: block; margin-top: 9px; font: 500 12.5px/1.2 var(--sans); }
.person .prole { display: block; margin-top: 3px; font: 400 10px/1.25 var(--sans); color: rgba(166, 182, 161, .95); }
.person.selected .orb { box-shadow: inset 1px 2px 3px rgba(248, 255, 230, .4), inset -3px -4px 6px rgba(0, 27, 19, .35), 4px 15px 21px rgba(0, 28, 19, .4), 0 0 0 5px rgba(223, 194, 127, .1), 0 0 0 6px rgba(223, 194, 127, .5); }
.person.target .orb { transform: scale(1.1); box-shadow: 0 0 0 7px rgba(212, 223, 169, .14), 0 0 0 8px rgba(212, 223, 169, .7), 4px 15px 30px rgba(0, 28, 19, .4); }
.person.away .orb { filter: saturate(.25); opacity: .45; }
.away-badge { position: absolute; left: 10px; top: 46px; border-radius: 20px; background: #5c674b; color: var(--paper); font: 500 8.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 4px 6px; }
.token { position: absolute; transform: translate(-50%, -50%) rotate(-4deg); z-index: 8; display: flex; gap: 7px; align-items: center;
  padding: 10px 14px; border-radius: 28px; white-space: nowrap; color: #253f2a; font: 500 11.5px/1 var(--sans); letter-spacing: .01em;
  background: linear-gradient(155deg, #e5c783, #b19861); border: 1px solid rgba(231, 210, 150, .6);
  box-shadow: 2px 9px 18px rgba(4, 26, 19, .55), inset 0 1px 0 rgba(255, 255, 255, .35);
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
  transition: left .65s var(--ease), top .65s var(--ease), transform .65s var(--ease); }
.token[data-at="owner"] { transform: translate(-50%, -50%) rotate(5deg); }
.token.dragging { transition: none; cursor: grabbing; transform: translate(-50%, -50%) scale(1.12) rotate(-6deg); box-shadow: 8px 18px 28px rgba(4, 26, 19, .5); }
.token svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.4; }
.token.static { position: static; transform: rotate(-2deg); align-self: flex-start; margin: 18px 0 6px; cursor: default; }
.token-hint { position: absolute; font: italic 400 14px/1 var(--serif); color: rgba(177, 187, 150, .85); rotate: 4deg; pointer-events: none; }
.status { position: absolute; left: 50%; top: 45%; transform: translateX(-50%); max-width: 96px; text-align: center; font: 500 9.5px/1.45 var(--mono); letter-spacing: .04em; color: var(--gold-bright); pointer-events: none; }
.lock { position: absolute; right: 0; bottom: 2%; display: flex; gap: 6px; align-items: center; font: 400 11px/1 var(--sans); color: rgba(166, 182, 161, .9); }
.lock svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.3; }
.story { margin-top: 10px; min-height: 124px; }
.story h2 { font: 400 29px/1.04 var(--serif); margin: 0 0 8px; }
.story p { margin: 0; font: 400 15px/1.5 var(--sans); color: var(--on-night-muted); }
.control { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; margin-top: 16px; border-radius: 18px; border: 1px solid var(--night-line); font: 400 14px/1.3 var(--sans); color: var(--on-night-muted); }
.control b { color: var(--on-night); font-weight: 500; }
.switch { width: 50px; height: 30px; border-radius: 30px; background: #4c5b4c; position: relative; transition: background .3s var(--ease); flex: none; }
.switch i { position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--paper); box-shadow: 0 2px 6px rgba(0, 0, 0, .3); transition: transform .35s var(--spring); }
.switch[aria-checked="true"] { background: #8aa47a; }
.switch[aria-checked="true"] i { transform: translateX(20px); }
.pair { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; margin: 12px 0 12px; }
.pair .btn { min-height: 52px; }
.steps { margin-top: 22px; border-radius: 22px; background: var(--paper-bright); color: var(--ink); padding: 0 18px; }
.steps summary { list-style: none; display: flex; justify-content: space-between; align-items: center; padding: 18px 0; cursor: pointer; }
.steps summary::-webkit-details-marker { display: none; }
.steps summary::after { content: "+"; font: 400 22px/1 var(--serif); color: var(--muted); margin-left: 10px; transition: transform .3s var(--ease); }
.steps[open] summary::after { transform: rotate(45deg); }
.steps[open] .flow li { opacity: 1; transform: none; }
.steps .fine { padding-bottom: 18px; }
.obs-nav { position: sticky; bottom: 0; z-index: 10; margin: 0 calc(var(--gutter) * -1); padding: 10px 22px calc(env(safe-area-inset-bottom) + 12px);
  display: flex; justify-content: space-around; background: rgba(16, 42, 36, .9); border-top: 1px solid rgba(168, 185, 163, .16); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.obs-nav button { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 70px; padding: 4px 10px; color: #788f7d; font: 500 11px/1 var(--sans); transition: color .3s; }
.obs-nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.obs-nav .on { color: var(--paper); }
.obs-nav .on svg { color: var(--gold-bright); }
.toast { position: absolute; left: 50%; bottom: 92px; z-index: 30; transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  width: max-content; max-width: calc(100% - 40px); padding: 14px 18px; border-radius: 15px; background: var(--paper); color: var(--ink);
  font: 400 13px/1.4 var(--sans); box-shadow: 0 10px 40px rgba(0, 0, 0, .4); transition: all .35s var(--ease); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.steps .eyebrow, .paper-note .eyebrow, .suggest .eyebrow { color: var(--muted); }
.steps .fine, .suggest .fine { color: var(--faint); }

/* Evidence */
.paper-note { margin-top: 22px; padding: 22px 20px; border-radius: 6px 22px 22px 22px; background: var(--paper); color: var(--ink); rotate: -.6deg; box-shadow: 0 20px 40px -18px rgba(0, 0, 0, .6); }
.paper-note blockquote { margin: 12px 0 12px; font: 400 23px/1.22 var(--serif); }
.paper-note small { display: block; font: 400 12.5px/1.5 var(--sans); color: var(--muted); }
.textbtn { align-self: center; margin-top: 12px; padding: 12px; font: 400 13.5px/1 var(--sans); color: var(--on-night-muted); text-decoration: underline; text-decoration-color: var(--gold-soft); text-underline-offset: 4px; }
.read { margin-top: 12px; padding: 16px 0 0; border-top: 1px solid var(--night-line); }
.read .kind { display: flex; align-items: center; gap: 8px; font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold-bright); }
.read .kind i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--gold-bright); }
.read p { margin: 8px 0 0; font: 400 15.5px/1.5 var(--sans); color: var(--on-night); }
.read.ask { padding: 16px; border: 0; border-radius: 18px; background: rgba(223, 194, 127, .08); }
.read.ask p { font: 400 21px/1.25 var(--serif); }

/* Test */
.rowlist { margin: 16px 0 18px; border-top: 1px solid var(--night-line); text-align: left; }
.rowlist div { display: grid; grid-template-columns: 70px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--night-line); }
.rowlist small { font: 500 10px/1.7 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold-bright); }
.rowlist p { margin: 0; font: 400 15px/1.5 var(--sans); }
.empty-orbit { width: 180px; height: 180px; margin: 22px auto; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid rgba(223, 194, 127, .16); box-shadow: 0 0 0 22px rgba(223, 194, 127, .04), 0 0 0 46px rgba(223, 194, 127, .02); }
.empty-orbit .orb { width: 90px; height: 90px; font-size: 36px; }
.suggest { margin: 4px 0 18px; padding: 18px; border-radius: 20px; background: var(--paper); color: var(--ink); text-align: left; }
.suggest .big-move { margin: 8px 0 8px; font-size: 26px; }
.suggest .big-move span { display: inline; }
.big-move { font: 400 34px/1.02 var(--serif); margin: 0 0 16px; }
.big-move span { display: block; color: var(--pine); font-style: italic; }
.seal-done { width: 64px; height: 64px; margin: 10px auto 18px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(155deg, #e5c783, #b19861); box-shadow: 0 10px 30px -8px rgba(223, 194, 127, .6); }
.seal-done svg { width: 26px; height: 26px; stroke: #253f2a; fill: none; stroke-width: 2; }
.center-pane .title { margin-top: 8px; }
.center-pane .lede { margin: 12px 0 0; }
.decide3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.decide3 button { padding: 16px 0; border-radius: 16px; border: 1px solid var(--night-line); font: 400 22px/1 var(--serif); transition: all .35s var(--ease); }
.decide3 button[aria-pressed="true"] { background: var(--gold-bright); color: #253f2a; border-color: transparent; }

/* Sheet extras */
.owners { display: grid; gap: 8px; margin-top: 18px; }
.owners button { display: flex; gap: 14px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 18px; background: var(--paper-bright); border: 1px solid var(--line-soft); }
.owners button[aria-pressed="true"] { border-color: var(--pine); box-shadow: 0 0 0 1px var(--pine); }
.owners b { display: block; font: 500 15px/1.3 var(--sans); }
.owners b em { font-style: normal; font-weight: 400; color: var(--faint); }
.owners small { display: block; font: 400 13px/1.3 var(--sans); color: var(--muted); }
.orb.sm { width: 40px; height: 40px; margin: 0; font-size: 17px; flex: none; }
#correction-form textarea.field { min-height: 130px; font-size: 22px; margin-top: 8px; }

/* ------------------------------------------------------------------
   Invitation — the premium card
------------------------------------------------------------------- */
.invite { display: flex; flex-direction: column; min-height: 100%; }
.invite-card {
  position: relative; margin-top: 18px; padding: 30px 24px 26px; border-radius: 30px; color: var(--on-night);
  background:
    radial-gradient(420px 260px at 100% 0%, rgba(176, 138, 74, .20), transparent 60%),
    radial-gradient(360px 300px at 0% 100%, rgba(168, 207, 209, .10), transparent 60%),
    linear-gradient(160deg, #0f3a30, var(--pine-dark) 55%, #081512);
  box-shadow: var(--shadow-float), inset 0 1px 0 rgba(255, 255, 255, .06);
  overflow: hidden;
}
.invite-card::before { content: ""; position: absolute; inset: 9px; border-radius: 22px; border: 1px solid var(--gold-soft); pointer-events: none; }
.invite-card::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .09) 50%, transparent 65%);
  transform: translateX(-100%); animation: sheen 5s var(--ease) 1.2s infinite;
}
@keyframes sheen { 0% { transform: translateX(-100%); } 35%, 100% { transform: translateX(100%); } }
.invite-card .eyebrow { color: var(--gold); }
.invite-card h2 { font: 400 40px/1 var(--serif); margin: 14px 0 12px; }
.invite-card h2 em { color: var(--gold); }
.invite-card .lede { color: var(--on-night-muted); font-size: 15px; }
.price { display: flex; align-items: baseline; gap: 10px; margin: 24px 0 4px; }
.price b { font: 400 54px/1 var(--serif); letter-spacing: -.01em; }
.price span { color: var(--on-night-muted); font: 400 12px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.rows { margin: 18px 0 0; border-top: 1px solid var(--night-line); }
.rows div { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--night-line); }
.rows dt { font: 400 10.5px/1.6 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--on-night-faint); }
.rows dd { margin: 0; font: 400 14px/1.45 var(--sans); }
.receive { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.receive li::before { content: "✦"; color: var(--gold); font-size: 9px; margin-right: 8px; vertical-align: 2px; }
.sig { display: flex; align-items: center; gap: 12px; margin-top: 22px; }
.sig .emblem { width: 34px; height: 34px; color: var(--gold); }
.sig .emblem circle { opacity: 1; animation: none; fill: var(--pine-dark); }
.sig p { margin: 0; font: 400 13px/1.45 var(--sans); color: var(--on-night-muted); }
.invite-actions { display: grid; gap: 10px; margin-top: 24px; }
.sent { text-align: center; padding: 18px 8px 0; }
.sent .title { margin: 12px 0 10px; }

/* ------------------------------------------------------------------
   Home — the observatory, modular
------------------------------------------------------------------- */
.home-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 26px; }
.home-head .title { margin-top: 10px; }
.modules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mod:not(.wide):not(.ritual) h4 { font-size: 22px; hyphens: auto; }
.mod {
  position: relative; text-align: left; border-radius: 24px; padding: 18px; min-height: 150px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 18px;
  background: var(--paper-bright); border: 1px solid var(--line-soft); box-shadow: var(--shadow-card);
  transition: transform .3s var(--ease);
}
.mod:active { transform: scale(.98); }
.mod.wide { grid-column: 1 / -1; }
.mod.dark { background: linear-gradient(160deg, #0f3a30, var(--pine-dark)); color: var(--on-night); border-color: transparent; }
.mod.dark .eyebrow { color: var(--gold); }
.mod.dark .fine { color: var(--on-night-faint); }
.mod h4 { font: 400 26px/1.05 var(--serif); margin: 6px 0 0; }
.mod .go { position: absolute; right: 16px; top: 16px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; }
.mod.dark .go { border-color: var(--night-line); }
.mod .go svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.mini-flow { display: flex; align-items: center; gap: 0; margin-top: 4px; }
.mini-flow i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--on-night-muted); flex: none; }
.mini-flow i.flag { border-color: var(--coral); background: var(--coral); box-shadow: 0 0 0 4px rgba(200, 100, 78, .2); }
.mini-flow b { flex: 1; height: 1px; background: var(--night-line); }
.ritual { grid-column: 1 / -1; }
.ritual .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 14px; }
.ritual .choices button { padding: 16px 0 14px; border-radius: 16px; background: var(--paper-deep); font: 400 22px/1 var(--serif); transition: all .35s var(--ease); }
.ritual .choices button small { display: block; margin-top: 6px; font: 400 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.ritual .choices button[aria-pressed="true"] { background: var(--pine); color: var(--paper); }
.ritual .choices button[aria-pressed="true"] small { color: rgba(244, 241, 232, .6); }
.ritual .answer { margin: 12px 0 0; min-height: 3em; font: 400 14px/1.5 var(--sans); color: var(--muted); }
.home-foot { text-align: center; margin-top: 30px; }
.home-foot p { font: 400 italic 20px/1.3 var(--serif); color: var(--muted); margin: 0 0 6px; }

/* ------------------------------------------------------------------
   Bottom sheet
------------------------------------------------------------------- */
.sheet-root { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
.sheet-scrim { position: absolute; inset: 0; background: rgba(7, 17, 14, .45); opacity: 0; transition: opacity .45s var(--ease); backdrop-filter: blur(2px); }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--paper); border-radius: 30px 30px 0 0; padding: 12px var(--gutter) calc(env(safe-area-inset-bottom) + 28px);
  transform: translateY(100%); visibility: hidden; transition: transform .6s var(--ease), visibility 0s linear .6s; box-shadow: 0 -20px 60px -20px rgba(0, 0, 0, .5);
  scrollbar-width: none;
}
.sheet-root.open { pointer-events: auto; }
.sheet-root.open .sheet-scrim { opacity: 1; }
.sheet-root.open .sheet { transform: none; visibility: visible; transition: transform .6s var(--ease); }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 18px; }
.sheet .title { margin: 10px 0 12px; }
.method { list-style: none; margin: 22px 0 0; padding: 0; counter-reset: m; }
.method li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 16px 0; border-top: 1px solid var(--line-soft); }
.method li span { font: 400 30px/1 var(--serif); color: var(--gold); }
.method b { font: 500 16px/1.3 var(--sans); }
.method p { margin: 4px 0 0; font: 400 14px/1.5 var(--sans); color: var(--muted); }
.ask { display: grid; gap: 8px; margin-top: 20px; }
.ask div { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 16px; background: var(--paper-bright); border: 1px solid var(--line-soft); font: 400 15px/1.35 var(--sans); }
.ask .yes svg { stroke: var(--pine); }
.ask .no { color: var(--muted); }
.ask .no span { text-decoration: line-through; text-decoration-color: var(--coral); }
.ask svg { flex: none; width: 16px; height: 16px; fill: none; stroke: var(--coral); stroke-width: 1.8; stroke-linecap: round; }
.fineprint p { font: 400 14px/1.6 var(--sans); color: var(--muted); margin: 14px 0 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .emblem .draw { stroke-dashoffset: 0; }
  .emblem circle { opacity: 1; }
}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="backdrop-copy" aria-hidden="true"><b>Human judgment, made navigable.</b>Astervell · The Observatory<br>Best on a phone</div>

<main id="app">
  <div id="sky" aria-hidden="true"></div>
  <div id="stage"></div>
  <div class="sheet-root" id="sheet" aria-hidden="true">
    <div class="sheet-scrim" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="grab" data-close></div><div id="sheet-body"></div></div>
  </div>
  <div class="toast" role="status" id="toast"></div>
  <div class="grain" aria-hidden="true"></div>
  <p class="sr" aria-live="polite" id="announce"></p>
</main>

<noscript><p style="color:#efeadc;padding:24px;font-family:Georgia,serif">The Observatory needs JavaScript. You can still reach Astervell at <a style="color:#b08a4a" href="https://astervell.com">astervell.com</a>.</p></noscript>

<script>
(() => {
'use strict';

/* ==================================================================
   Content — everything the Observatory says lives here, separate from
   the choreography below, so either can change on its own.
   ================================================================== */
const BRAND = {
  email: 'agentflow.work@gmail.com',
  calendar: 'https://calendly.com/agentflow-work/30min',
  founder: 'Rahmat',
  site: 'https://astervell.com',
};

const QUESTIONS = [
  { id: 'name', type: 'text', kicker: 'Before we begin',
    q: 'What should we <em>call</em> you?', help: 'A first name is plenty. It only appears on your observation card.',
    placeholder: 'First name' },
  { id: 'team', type: 'single', kicker: 'The team',
    q: 'How many people touch the work?', help: 'Count everyone involved in the workflow, including you.',
    options: [
      { v: 'solo', t: 'Just me' },
      { v: 'small', t: '2–5 people' },
      { v: 'mid', t: '6–15 people' },
      { v: 'large', t: '16 or more' },
    ] },
  { id: 'workflow', type: 'single', kicker: 'The workflow',
    q: 'Which workflow keeps <em>slipping</em>?', help: 'Pick the one that costs you the most attention. We look at one at a time.',
    options: [
      { v: 'lead', t: 'Lead intake', s: 'New requests, from first contact to a reply' },
      { v: 'scheduling', t: 'Scheduling', s: 'Finding a time and confirming it' },
      { v: 'followup', t: 'Follow-up', s: 'What happens after the conversation ends' },
      { v: 'knowledge', t: 'Team knowledge', s: 'Answers that live in one person’s head' },
    ] },
  { id: 'doors', type: 'multi', kicker: 'The doors',
    q: 'Where does it arrive?', help: 'Choose every door work comes through. Most teams have more than they think.',
    options: [
      { v: 'form', t: 'Website form', short: 'Form' },
      { v: 'email', t: 'Email', short: 'Email' },
      { v: 'phone', t: 'Phone & voicemail', short: 'Phone' },
      { v: 'text', t: 'Texts & DMs', short: 'Texts' },
      { v: 'person', t: 'In person', short: 'In person' },
      { v: 'referral', t: 'Referrals', short: 'Referrals' },
    ] },
  { id: 'owner', type: 'single', kicker: 'The handoff',
    q: 'Who usually takes the <em>next step</em>?', help: 'Not who should, but who usually does.',
    options: [
      { v: 'founder', t: 'The owner' },
      { v: 'coordinator', t: 'An office coordinator' },
      { v: 'first', t: 'Whoever sees it first' },
      { v: 'depends', t: 'It depends on the day' },
    ] },
  { id: 'away', type: 'single', kicker: 'The gap',
    q: 'When that person is away, what happens?', help: 'An honest “not sure” is useful evidence too.',
    options: [
      { v: 'named', t: 'A named person covers' },
      { v: 'waits', t: 'It waits for their return' },
      { v: 'notices', t: 'Whoever notices picks it up' },
      { v: 'unsure', t: 'Honestly, not sure' },
    ] },
  { id: 'frequency', type: 'single', kicker: 'The pattern',
    q: 'How often does something slip?', help: 'Your best guess. We will treat it as reported, not measured.',
    options: [
      { v: 'rare', t: 'Rarely, but it stings' },
      { v: 'monthly', t: 'A few times a month' },
      { v: 'weekly', t: 'Most weeks' },
      { v: 'often', t: 'More than we’d admit' },
    ] },
  { id: 'signal', type: 'single', kicker: 'The signal',
    q: 'How do you usually <em>find out</em>?',
    options: [
      { v: 'client', t: 'The client follows up' },
      { v: 'teammate', t: 'A teammate notices' },
      { v: 'review', t: 'In a weekly review' },
      { v: 'late', t: 'Weeks later, or never' },
    ] },
  { id: 'judgment', type: 'single', kicker: 'The boundary',
    q: 'Which decision must stay <em>human</em>?', help: 'Technology enters only where it keeps this judgment visible.',
    options: [
      { v: 'fit', t: 'Who is a good fit' },
      { v: 'urgency', t: 'What is urgent' },
      { v: 'promise', t: 'What we promise' },
      { v: 'tone', t: 'The relationship itself' },
    ] },
  { id: 'note', type: 'long', kicker: 'In your words',
    q: 'In one sentence, where does it get stuck?', help: 'Optional. Describe the process only.',
    placeholder: 'Requests sit in the shared inbox when…', max: 280 },
];

const LABEL = Object.fromEntries(QUESTIONS.filter(q => q.options).map(q => [q.id, Object.fromEntries(q.options.map(o => [o.v, o.t]))]));

const PHRASE = {
  owner: { founder: 'the owner', coordinator: 'the coordinator', first: 'whoever saw it first', depends: 'the person on duty' },
  role: { founder: 'Owner', coordinator: 'Office coordinator', first: 'First to notice', depends: 'Unassigned' },
  away: {
    named: 'a named person is meant to cover',
    waits: 'it waits for their return',
    notices: 'whoever notices picks it up',
    unsure: 'nobody is quite sure what happens',
  },
  frequency: { rare: 'rarely, but it stings', monthly: 'a few times a month', weekly: 'most weeks', often: 'more often than the team would admit' },
  signal: { client: 'the client follows up', teammate: 'a teammate notices', review: 'it surfaces in a weekly review', late: 'weeks later, if at all' },
  judgment: { fit: 'service fit', urgency: 'urgency', promise: 'commitments and promises', tone: 'the relationship and its tone' },
};

const WORKFLOWS = {
  lead: {
    arc: 'From a request<br>to a <em>confirmed visit.</em>',
    unit: 'requests',
    question: o => `Who takes the next action when ${o} is away?`,
    flag: 1,
    steps: (doors, role, founder) => [
      ['Request arrives', 'Prospective client', doors],
      ['Request received', role, 'Shared inbox'],
      ['Fit reviewed', founder ? 'Owner' : `${role} / owner`, 'Human review'],
      ['Times exchanged', `${role} + client`, 'Email / calendar'],
      ['Visit confirmed', role, 'Email / calendar'],
      ['Time accepted', 'Client', 'Acceptance route to clarify'],
    ],
    move: ['Name the cover.', 'Confirm the handoff.'],
    change: 'Use the place requests already land to name the next-action role and the next action. Before any absence, the cover person explicitly accepts responsibility.',
    measure: 'Minutes to an acknowledged owner, and whether the next action is visible. Keep unresolved requests visible.',
  },
  scheduling: {
    arc: 'From a request<br>to a <em>booked time.</em>',
    unit: 'bookings',
    question: () => 'Who holds an open booking between messages?',
    flag: 3,
    steps: (doors, role) => [
      ['Time requested', 'Client', doors],
      ['Availability checked', role, 'Calendar'],
      ['Options sent', role, 'Email / text'],
      ['Client chooses', 'Client', 'Reply thread'],
      ['Booking confirmed', role, 'Calendar'],
      ['Reminder sent', `System or ${role.toLowerCase()}`, 'Route to clarify'],
    ],
    move: ['One holder per booking.', 'Pass it on out loud.'],
    change: 'Each open scheduling thread carries one named holder until a time is confirmed. Handing it over means the next holder says so, in the thread.',
    measure: 'Messages and hours from first request to a confirmed time, and how many threads have no visible holder.',
  },
  followup: {
    arc: 'From a conversation<br>to a <em>closed loop.</em>',
    unit: 'conversations',
    question: () => 'Who owns the next step once the conversation ends?',
    flag: 2,
    steps: (doors, role) => [
      ['Conversation ends', `Client + ${role.toLowerCase()}`, doors],
      ['Next step noted', role, 'Notes or memory'],
      ['Owner assigned', 'To clarify', 'Not yet visible'],
      ['Follow-up sent', role, 'Email / phone'],
      ['Reply received', 'Client', 'Inbox'],
      ['Loop closed', role, 'Shared record'],
    ],
    move: ['Name the next step', 'before you leave the room.'],
    change: 'Every conversation ends with a written next step, an owner and a date, recorded where the team already looks. Nothing else changes.',
    measure: 'Share of conversations with a written next step and owner, and days to the first follow-up.',
  },
  knowledge: {
    arc: 'From a question<br>to an <em>answer anyone can find.</em>',
    unit: 'repeated questions',
    question: o => `Where does the answer go after ${o} gives it?`,
    flag: 4,
    steps: (doors, role) => [
      ['Question arises', 'Teammate', 'Chat or in person'],
      ['Asks around', 'Teammate', 'Chat'],
      ['Finds the go-to person', role, 'Memory'],
      ['Answer given', role, 'Conversation'],
      ['Answer recorded', 'To clarify', 'No shared place yet'],
      ['Next person finds it', 'Next teammate', 'Unknown'],
    ],
    move: ['Write down', 'the next answer.'],
    change: 'The next time the go-to person answers a repeated question, the answer is recorded in one shared place the team already uses.',
    measure: 'How often the same question is asked twice, and whether the second person finds the answer without asking.',
  },
};

const HYPOTHESIS = {
  named: 'The cover role may exist on paper but not in practice. Requests are received, but no one visibly accepts them.',
  waits: 'An explicitly acknowledged cover role may reduce the work left without a visible next action.',
  notices: 'When everyone can pick it up, no one is clearly holding it. A named next-action role may reduce drift.',
  unsure: 'The handoff may be invisible rather than broken. Making the next action visible may be the first useful change.',
};
const FLAGNOTE = {
  named: 'Cover is named, but acceptance is not visible.',
  waits: o => `When ${o} is away, this waits.`,
  notices: 'Anyone can pick it up, so no one clearly holds it.',
  unsure: 'What happens here is unclear from your answers.',
};

const METHOD = [
  ['Listen', 'Walk through one concrete example without collecting sensitive records.'],
  ['Map', 'Trace steps, owners and decisions. Ask the operator to correct the reconstruction.'],
  ['Check', 'Label supported friction, alternative explanations and what is still unknown.'],
  ['Design', 'Propose one reversible change, or recommend no change when evidence is insufficient.'],
  ['Test plan', 'Define a baseline, a small trial and a 30-day keep, revise or undo decision for the client.'],
];

const RITUAL = {
  keep: 'Keep it, and keep watching workload and handoff quality alongside speed. A faster handoff is not better if it moves work to the wrong person.',
  revise: 'Revise it. Change one thing, name who decided, and run the same comparison again.',
  undo: 'Undo it. Restore the prior convention without deleting the history. A finding that no change is supported is still a finding.',
};

/* ==================================================================
   Engine — turns answers into a draft observation. Deterministic and
   local: nothing leaves the device unless you choose to email it.
   ================================================================== */
function compose(a, number) {
  const wf = WORKFLOWS[a.workflow] || WORKFLOWS.lead;
  const doorsList = (a.doors || []).map(d => LABEL.doors[d]);
  const doors = doorsList.length ? doorsList.slice(0, 2).join(' / ') + (doorsList.length > 2 ? ` +${doorsList.length - 2}` : '') : 'Several doors';
  const owner = PHRASE.owner[a.owner] || 'the person on duty';
  const role = PHRASE.role[a.owner] || 'Unassigned';
  const away = a.away || 'unsure';
  const steps = wf.steps(doors, role, a.owner === 'founder');
  const flagNote = typeof FLAGNOTE[away] === 'function' ? FLAGNOTE[away](owner) : FLAGNOTE[away];
  const judgment = PHRASE.judgment[a.judgment] || 'the relationship';

  const reported = [
    `${LABEL.workflow[a.workflow] || 'The work'} arrives through ${doorsList.length ? (doorsList.length === 1 ? 'one door' : doorsList.length + ' doors') : 'several doors'}.`,
    `The next step usually sits with ${owner}; when they are away, ${PHRASE.away[away]}.`,
    `It slips ${PHRASE.frequency[a.frequency] || 'sometimes'}, and you usually find out when ${PHRASE.signal[a.signal] || 'someone notices'}.`,
  ].join(' ');

  const contrary = a.frequency === 'rare'
    ? 'At this frequency the cost may be real but rare. Adding a control could create more work than it saves.'
    : `Some waits may be intentional: decisions about ${judgment} sometimes need time. Not every pause is a slip.`;
  const changeMind = away === 'named'
    ? 'A safe walkthrough shows the named cover already accepts requests reliably. Then do not add another control.'
    : `A safe walkthrough shows ${wf.unit} already reach an acknowledged owner in reasonable time. Then no change is supported, and we say so.`;

  return {
    id: 'obs-' + Date.now().toString(36),
    number,
    created: new Date().toISOString(),
    name: (a.name || '').trim(),
    answers: a,
    workflowLabel: LABEL.workflow[a.workflow] || 'Workflow',
    arc: wf.arc,
    steps, flag: wf.flag, flagNote,
    question: wf.question(owner),
    reported, hypothesis: HYPOTHESIS[away], contrary, changeMind,
    judgment,
    move: wf.move, change: wf.change, measure: wf.measure, unit: wf.unit,
  };
}

/* ==================================================================
   Utilities
   ================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(3, '0');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 60) : ms));
const announce = t => { $('#announce').textContent = t; };
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

const store = {
  get(k, d) { try { const v = localStorage.getItem('astervell.observatory.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('astervell.observatory.' + k, JSON.stringify(v)); } catch (e) {} },
};

const ICON = {
  back: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  close: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  arrow: '<svg class="arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  go: '<svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg>',
  shield: '<svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  cross: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  explore: '<svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="3"/><circle cx="17" cy="16" r="4"/><path d="M9 9l5 4M5 18l2-8"/><circle cx="5" cy="19" r="1"/></svg>',
  evidence: '<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h5"/></svg>',
  test: '<svg viewBox="0 0 24 24"><path d="M18 6a8 8 0 1 0 2 11M18 2v5h-5M9 12l2 2 4-4"/></svg>',
  key: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="4"/><path d="m11 11 9 9m-6-6 3-3m0 6 3-3"/></svg>',
  lock: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 7V5a4 4 0 0 1 8 0v2M3 7h10v8H3z"/></svg>',
};

// The mark: a peak, a horizon, and three nodes along the path of the work.
function emblem(cls = '', animated = false) {
  const d = animated ? ' draw' : '';
  return `<svg class="emblem ${cls}" viewBox="0 0 80 80" aria-hidden="true">
    <path class="${d}" style="--len:120;--dl:.25s" d="M26 56 L42 17 Q44 12.5 46 17 L64 60"/>
    <path class="${d}" style="--len:90;--dl:.7s" d="M9 70 Q24 50 38 60 T70 70"/>
    <path class="${d}" style="--len:40;--dl:1s" d="M40 44 Q48 54 60 58"/>
    <circle cx="40" cy="44" r="2.8" style="--dl:1.5s"/><circle cx="50" cy="53.5" r="2.8" style="--dl:1.65s"/><circle cx="61" cy="58.4" r="2.8" style="--dl:1.8s"/>
  </svg>`;
}

/* Sky — seeded so the stars keep their places between visits */
function paintSky() {
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  let stars = '';
  for (let i = 0; i < 90; i++) {
    const r = rnd() < .9 ? .5 + rnd() * .7 : 1.2 + rnd() * .6;
    stars += `<circle class="st" cx="${(rnd() * 100).toFixed(2)}%" cy="${(rnd() * 72).toFixed(2)}%" r="${r.toFixed(2)}" style="--o:${(.25 + rnd() * .6).toFixed(2)};--d:${(3 + rnd() * 6).toFixed(1)}s;--dl:${(-rnd() * 6).toFixed(1)}s"/>`;
  }
  $('#sky').innerHTML = `<svg preserveAspectRatio="none">${stars}</svg><div class="horizon"></div>`;
}

function dial() {
  let ticks = '';
  for (let i = 0; i < 120; i++) {
    const major = i % 10 === 0;
    const a = (i / 120) * Math.PI * 2, r1 = 250, r2 = major ? 232 : 242;
    ticks += `<line class="t${major ? ' major' : ''}" x1="${260 + r1 * Math.cos(a)}" y1="${260 + r1 * Math.sin(a)}" x2="${260 + r2 * Math.cos(a)}" y2="${260 + r2 * Math.sin(a)}"/>`;
  }
  return `<div class="dial" aria-hidden="true"><svg viewBox="0 0 520 520"><circle class="ring" cx="260" cy="260" r="200"/><circle class="ring" cx="260" cy="260" r="140" stroke-dasharray="2 8"/>${ticks}</svg></div>`;
}

/* ==================================================================
   Scene manager — one scene on stage at a time, each with a tone
   (night or paper) that the frame crossfades between.
   ================================================================== */
const stage = $('#stage');
let current = null;
const state = {
  answers: {},
  obs: store.get('latest', null),
  count: store.get('count', 0),
};

function go(name, arg, dir = 1) {
  closeSheet();
  const mod = SCENES[name];
  const el = document.createElement('section');
  el.className = 'scene';
  el.dataset.scene = name;
  el.dataset.tone = mod.tone;
  el.style.setProperty('--dir', dir);
  el.innerHTML = mod.render(arg);
  document.documentElement.dataset.tone = mod.tone;
  $('meta[name="theme-color"]').content = mod.tone === 'night' ? '#07110e' : '#f4f1e8';
  stage.appendChild(el);
  const prev = current;
  current = el;
  if (prev) { prev.style.setProperty('--dir', dir); prev.classList.remove('in'); prev.classList.add('out'); setTimeout(() => prev.remove(), 750); }
  el.getBoundingClientRect();
  requestAnimationFrame(() => el.classList.add('in'));
  mod.mount && mod.mount(el, arg);
  const focus = el.querySelector('[data-focus]');
  if (focus) setTimeout(() => focus.focus({ preventScroll: true }), 60);
}

/* ==================================================================
   Scenes
   ================================================================== */
const SCENES = {};

/* 1 · Arrival ------------------------------------------------------ */
SCENES.arrival = {
  tone: 'night',
  render() {
    const back = state.obs;
    return `
      ${dial()}
      <div class="arrival">
        <header class="arrival-top rise" style="--i:0">
          <div class="wordmark">Astervell<small>The Observatory</small></div>
          <span class="num">${back ? 'N° ' + pad(state.count) : 'Est. Seattle'}</span>
        </header>
        <div class="arrival-hero">
          ${emblem('', true)}
          <h1 class="display rise" style="--i:3" tabindex="-1" data-focus>${back ? `Welcome back${state.obs.name ? ',<br><em>' + esc(state.obs.name) + '</em>' : '.'}` : 'See where<br>work gets <em>stuck.</em>'}</h1>
          <p class="lede rise" style="--i:4">${back
            ? 'Your last observation is waiting. Revisit it, keep the Day&nbsp;30 decision, or begin another.'
            : 'Answer ten small questions about one workflow that keeps slipping. We’ll return a draft observation: the workflow, the evidence and one reversible test.'}</p>
        </div>
        <footer class="arrival-foot">
          ${back ? `
            <button class="btn btn-light rise" style="--i:6" data-act="home">Enter the observatory ${ICON.arrow}</button>
            <button class="btn btn-ghost rise" style="--i:7" data-act="begin">Begin a new observation</button>`
          : `
            <button class="btn btn-light rise" style="--i:6" data-act="begin">Begin an observation ${ICON.arrow}</button>
            <div class="meta-row rise" style="--i:7"><span>4 minutes</span><span>No records</span><span>Stays on device</span></div>`}
        </footer>
      </div>`;
  },
  mount(el) {
    el.addEventListener('click', e => {
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (act === 'begin') { state.answers = {}; go('intake', 0); }
      if (act === 'home') go('home');
    });
  },
};

/* 2 · Intake ------------------------------------------------------- */
SCENES.intake = {
  tone: 'paper',
  render() {
    return `
      <div class="intake">
        <div class="intake-bar">
          <button class="iconbtn" data-act="back" aria-label="Back">${ICON.back}</button>
          <div class="progress" aria-hidden="true">${QUESTIONS.map(() => '<i></i>').join('')}</div>
          <span class="num intake-count"></span>
        </div>
        <div class="q-wrap"></div>
      </div>`;
  },
  mount(el, start) {
    let i = start || 0;
    let busy = false;
    const wrap = $('.q-wrap', el);
    const bars = $$('.progress i', el);

    const show = (n, dir) => {
      i = n;
      const q = QUESTIONS[i];
      bars.forEach((b, k) => { b.className = k < i ? 'done' : k === i ? 'now' : ''; });
      $('.intake-count', el).textContent = `${String(i + 1).padStart(2, '0')} / ${QUESTIONS.length}`;
      const node = document.createElement('div');
      node.className = 'q enter';
      node.style.setProperty('--qdir', dir);
      node.innerHTML = questionHTML(q, state.answers[q.id]);
      const old = $('.q:not(.leave)', wrap);
      if (old) { old.style.setProperty('--qdir', dir); old.classList.add('leave'); setTimeout(() => old.remove(), 550); }
      wrap.appendChild(node);
      node.getBoundingClientRect();
      requestAnimationFrame(() => node.classList.remove('enter'));
      el.scrollTo({ top: 0 });
      bindQuestion(node, q);
      announce(`Question ${i + 1} of ${QUESTIONS.length}`);
      const f = node.querySelector('input, textarea') || node.querySelector('h2');
      setTimeout(() => f && f.focus({ preventScroll: true }), reduced ? 0 : 450);
    };

    const next = () => {
      if (i < QUESTIONS.length - 1) show(i + 1, 1);
      else go('composing');
    };

    const bindQuestion = (node, q) => {
      busy = false;
      if (q.type === 'single') {
        node.addEventListener('click', async e => {
          const opt = e.target.closest('.opt');
          if (!opt || busy) return;
          busy = true;
          $$('.opt', node).forEach(o => o.setAttribute('aria-checked', String(o === opt)));
          opt.classList.add('chosen');
          $('.opts', node).classList.add('settling');
          state.answers[q.id] = opt.dataset.v;
          buzz(8);
          await wait(460);
          next();
        });
      }
      if (q.type === 'multi') {
        const cont = $('[data-act="next"]', node);
        const sync = () => { cont.disabled = !(state.answers[q.id] || []).length; };
        node.addEventListener('click', e => {
          const opt = e.target.closest('.opt');
          if (!opt) return;
          const set = new Set(state.answers[q.id] || []);
          set.has(opt.dataset.v) ? set.delete(opt.dataset.v) : set.add(opt.dataset.v);
          state.answers[q.id] = q.options.map(o => o.v).filter(v => set.has(v));
          opt.setAttribute('aria-pressed', String(set.has(opt.dataset.v)));
          buzz(6);
          sync();
        });
        sync();
      }
      if (q.type === 'text' || q.type === 'long') {
        const input = $('input, textarea', node);
        const counter = $('.count', node);
        input.addEventListener('input', () => {
          state.answers[q.id] = input.value;
          if (counter) counter.textContent = `${input.value.length} / ${q.max}`;
        });
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && (q.type === 'text' || e.metaKey || e.ctrlKey)) { e.preventDefault(); next(); }
        });
      }
      node.addEventListener('click', e => {
        if (e.target.closest('[data-act="next"]')) next();
      });
    };

    el.addEventListener('click', e => {
      if (!e.target.closest('[data-act="back"]')) return;
      if (i === 0) go('arrival', null, -1); else show(i - 1, -1);
    });

    // Number keys choose options, like a well-made questionnaire.
    el.addEventListener('keydown', e => {
      const n = parseInt(e.key, 10);
      if (!n || e.target.matches('input, textarea')) return;
      const opt = $$('.q:not(.leave) .opt', el)[n - 1];
      if (opt) opt.click();
    });

    show(i, 1);
  },
};

function questionHTML(q, val) {
  let body = '';
  if (q.type === 'single' || q.type === 'multi') {
    const multi = q.type === 'multi';
    body = `<div class="opts" role="${multi ? 'group' : 'radiogroup'}" aria-labelledby="qh">
      ${q.options.map((o, k) => {
        const on = multi ? (val || []).includes(o.v) : val === o.v;
        return `<button class="opt${multi ? ' multi' : ''}" data-v="${o.v}" style="--i:${k}" ${multi ? `aria-pressed="${on}"` : `role="radio" aria-checked="${on}"`}>
          <span class="key" aria-hidden="true">${multi && on ? '✓' : k + 1}</span>
          <span><b>${o.t}</b>${o.s ? `<small>${o.s}</small>` : ''}</span>
        </button>`;
      }).join('')}
    </div>
    ${multi ? `<div class="q-actions"><button class="btn btn-primary" data-act="next">Continue ${ICON.arrow}</button></div>` : ''}`;
  } else if (q.type === 'text') {
    body = `<label class="sr" for="qi">${q.placeholder}</label>
      <input id="qi" class="field" type="text" autocomplete="given-name" maxlength="40" placeholder="${q.placeholder}" value="${esc(val)}">
      <div class="q-actions"><button class="btn btn-primary" data-act="next">Continue ${ICON.arrow}</button></div>`;
  } else {
    body = `<label class="sr" for="qi">${q.q}</label>
      <textarea id="qi" class="field" maxlength="${q.max}" placeholder="${q.placeholder}">${esc(val)}</textarea>
      <p class="num count">${(val || '').length} / ${q.max}</p>
      <div class="guard">${ICON.shield}<p class="fine" style="color:var(--muted)">Describe the process only. No customer or patient records, credentials, financial files or screenshots of private data.</p></div>
      <div class="q-actions"><button class="btn btn-primary" data-act="next">Compose my observation ${ICON.arrow}</button></div>`;
  }
  const clean = q.q.replace(/<[^>]+>/g, '');
  return `
    <div class="q-kicker eyebrow">${q.kicker}</div>
    <h2 class="title" id="qh" tabindex="-1" aria-label="${esc(clean)}">${q.q}</h2>
    ${q.help ? `<p class="lede">${q.help}</p>` : ''}
    ${body}`;
}

/* 3 · Composing — the curated pause -------------------------------- */
SCENES.composing = {
  tone: 'night',
  render() {
    const a = state.answers;
    const doors = (a.doors && a.doors.length ? a.doors : ['form', 'email', 'phone']).slice(0, 6);
    const nodes = doors.map((d, k) => {
      const ang = (k / doors.length) * Math.PI * 2 - Math.PI / 2;
      const x = 150 + 118 * Math.cos(ang), y = 150 + 118 * Math.sin(ang);
      const label = QUESTIONS.find(q => q.id === 'doors').options.find(x => x.v === d).short;
      const ty = y < 150 ? y - 12 : y + 20;
      return `<g class="node" style="transition-delay:${k * 120}ms"><circle cx="${x}" cy="${y}" r="6"/><text x="${x}" y="${ty}" text-anchor="middle">${esc(label)}</text></g>`;
    }).join('');
    const lines = [
      `Tracing ${doors.length === 1 ? 'one door' : doors.length + ' doors'} into one workflow`,
      'Placing the handoff where the work waits',
      'Separating what you reported from what might explain it',
      'Looking for a contrary explanation',
      'Drafting one reversible move',
    ];
    return `
      <div class="composing">
        <p class="eyebrow rise" style="--i:0;text-align:center">Composing your observation</p>
        <div class="orbit" aria-hidden="true">
          <svg viewBox="0 0 300 300">
            <circle class="rg" cx="150" cy="150" r="118"/>
            <g class="spin"><circle class="rg dash" cx="150" cy="150" r="80"/><circle cx="150" cy="70" r="2" fill="#b08a4a"/></g>
            <g class="spin rev"><circle class="rg dash" cx="150" cy="150" r="140"/><circle cx="290" cy="150" r="1.6" fill="#efeadc"/></g>
            ${nodes}
            <circle class="pulse" cx="150" cy="150" r="14"/>
            <circle class="core" cx="150" cy="150" r="9"/>
          </svg>
        </div>
        <ol class="steps-log" aria-live="polite">
          ${lines.map(l => `<li><span class="tick">${ICON.check}</span>${l}</li>`).join('')}
        </ol>
        <button class="skip" data-act="skip">Skip</button>
      </div>`;
  },
  async mount(el) {
    state.count += 1;
    const obs = compose(state.answers, state.count);
    state.obs = obs;
    store.set('latest', obs);
    store.set('count', state.count);

    let skipped = false;
    $('[data-act="skip"]', el).addEventListener('click', () => { skipped = true; go('reveal'); });
    const items = $$('.steps-log li', el);
    await wait(700);
    for (let k = 0; k < items.length && !skipped; k++) {
      items[k].classList.add('on');
      if (k === 1) $('.orbit', el).classList.add('converge');
      await wait(980);
      items[k].classList.add('done');
    }
    await wait(600);
    if (!skipped && current === el) go('reveal');
  },
};
