/* 5 · Observation — an explorable model of the handoff -------------- */
// Positions are shared by the people, the token and the SVG paths
// (viewBox 400 × 360), so drag targets and drawn lines always agree.
const MAP = {
  people: { holder: [100, 170], owner: [300, 200], cover: [110, 300] },
  token: { holder: [100, 104], owner: [300, 128], cover: [196, 286] },
  base: [
    'M200 64 C200 110 118 112 100 150',
    'M122 176 C190 176 240 184 272 196',
    'M100 192 C86 232 92 262 106 282',
    'M130 306 C210 330 270 284 296 226',
  ],
  path: {
    owner: 'M200 64 C200 110 118 112 100 150 S230 176 290 196',
    holder: 'M200 64 C200 110 118 112 100 150',
    cover: 'M200 64 C120 84 34 170 60 250 S92 296 104 298',
  },
};
const REQUEST = {
  lead: 'Could we book<br>a first visit?',
  scheduling: 'Does Thursday<br>still work?',
  followup: 'Great talking.<br>What’s next?',
  knowledge: 'Where’s the<br>template for this?',
};
const JSHORT = { fit: 'fit', urgency: 'urgency', promise: 'promises', tone: 'the relationship' };

function peopleFor(o) {
  const a = o.answers;
  if (a.team === 'solo') return {
    holder: { label: 'You', role: 'Replying', mono: 'Y' },
    owner: { label: 'You', role: 'Deciding', mono: 'Y' },
    cover: { label: 'Cover', role: 'Not yet named', mono: '✧' },
  };
  const holder = {
    founder: { label: 'Teammate', role: 'Sees it first', mono: 'T' },
    coordinator: { label: 'Coordinator', role: 'Shared inbox', mono: 'C' },
    first: { label: 'First to see it', role: 'Whoever’s there', mono: 'F' },
    depends: { label: 'On duty', role: 'Varies by day', mono: 'D' },
  }[a.owner] || { label: 'Coordinator', role: 'Shared inbox', mono: 'C' };
  return {
    holder,
    owner: { label: 'Owner', role: 'Decides ' + (JSHORT[a.judgment] || 'fit'), mono: 'O' },
    cover: { label: 'Cover', role: a.away === 'named' ? 'Named, not confirmed' : 'Not yet agreed', mono: '✧' },
  };
}
const startOf = o => (o.answers.owner === 'founder' ? 'owner' : 'holder');

function arrangement(o) {
  return Object.assign({ token: startOf(o), away: false, compare: false, staged: false, evidenceFirst: false, correction: '' },
    store.get('arr.' + o.id, {}));
}

function derive(o, arr) {
  const P = peopleFor(o);
  const tok = arr.compare ? startOf(o) : arr.token;
  const H = P.holder.label;
  const j = JSHORT[o.answers.judgment] || 'fit';
  const cover = o.answers.away === 'named' ? 'The named cover' : 'Someone';
  if (tok === 'owner') return {
    tok, blocked: false,
    title: 'Even the first reply<br>comes back to the owner.',
    body: `Move the reply token to ${H === 'You' ? 'a cover' : H.toLowerCase() + ' or a cover'}. Keep decisions about ${j} with the owner.`,
    status: 'Permission<br>concentrates here',
  };
  if (tok === 'holder' && arr.away) return {
    tok, blocked: true,
    title: tok === startOf(o) && !arr.compare ? 'The work waits<br>at an empty desk.' : 'The permission moved.<br>The gap did not.',
    body: `${H === 'You' ? 'You are' : H + ' is'} away. ${cover} would need to agree to cover before the work can move.`,
    status: 'An owner,<br>nobody available',
  };
  if (tok === 'holder') return {
    tok, blocked: false,
    title: `${H === 'You' ? 'You' : H} can reply.<br>The owner still decides ${j}.`,
    body: arr.token === startOf(o) && !arr.compare
      ? `This is the arrangement you described. Switch ${H === 'You' ? 'yourself' : H.toLowerCase()} to away and watch where the work goes.`
      : `${H} needs agreed wording and capacity. Try the boundary before keeping it.`,
    status: 'Acknowledge<br>before review',
  };
  return {
    tok, blocked: false,
    title: `The cover can reply.<br>The owner still decides ${j}.`,
    body: 'The cover needs capacity and an explicit agreement. The work has moved, not vanished.',
    status: 'Cover<br>accepts first',
  };
}

            ${['keep', 'revise', 'undo'].map(c => `<button data-rit="${c}" aria-pressed="${choice === c}">${c[0].toUpperCase() + c.slice(1)}</button>`).join('')}
          </div>
          <p class="fine center" role="status">${choice ? esc(RITUAL[choice]) : 'Saved on this device. No real workflow has changed.'}</p>
          ${inviteBtn}
          <button class="textbtn" data-act="explore">Back to the model</button>
        </section>`;
      if (tok === startOf(o) && !arr.evidenceFirst) return `
        <section class="pane center-pane">
          <p class="eyebrow pop-in">One reversible change</p>
          <h1 class="title pop-in" style="--i:1" tabindex="-1" data-focus>What would you<br><em>like to try?</em></h1>
          <div class="empty-orbit pop-in" style="--i:2"><span class="orb">${esc(P[tok].mono)}</span></div>
          <p class="lede pop-in" style="--i:3">The arrangement hasn’t changed yet. Move first-reply authority in the model, or check the evidence first.</p>
          <div class="suggest pop-in" style="--i:4"><span class="eyebrow">Astervell would start with</span><p class="big-move">${esc(o.move[0])} <span>${esc(o.move[1])}</span></p><p class="fine">${esc(o.change)}</p></div>
          <button class="btn btn-light" data-act="explore">Explore a change ${ICON.arrow}</button>
          <button class="textbtn" data-act="evfirst">Check the evidence first</button>
        </section>`;
      const ef = arr.evidenceFirst;
      const rows = ef ? [
        ['First', 'Walk through two more real examples with the person doing the work.'],
        ['Ask', o.question],
        ['Watch', 'What would contradict the explanation you started with?'],
        ['Then', 'Correct the map. Decide whether any change is justified.'],
      ] : [
        ['First', gap ? `Agree who covers while ${P.holder.label === 'You' ? 'you are' : P.holder.label.toLowerCase() + ' is'} away. Permission alone is not enough.` : `Agree wording, capacity and the boundary with ${tok === 'cover' ? 'the cover' : name.toLowerCase()}.`],
        ['Try', `${tok === 'cover' ? 'The cover' : name} acknowledges the next five comparable ${o.unit} over one week. The owner decides ${j}.`],
        ['Watch', o.measure],
        ['Undo if', 'Ownership gets less clear, capacity fails, or someone makes a commitment without authority.'],
      ];
      return `
        <section class="pane">
          <p class="eyebrow pop-in">${ef ? 'Understanding is a valid next step' : 'Keep it small. Keep it reversible.'}</p>
          <h1 class="title pop-in" style="--i:1" tabindex="-1" data-focus>${ef ? 'Check before<br><em>you change.</em>' : `Five ${esc(o.unit)}.<br><em>One new boundary.</em>`}</h1>
          <div class="token static pop-in" style="--i:2">${ICON.key} ${ef ? 'An evidence-first plan' : 'First reply · ' + esc(tok === 'cover' ? 'Cover' : name)}</div>
          <div class="rowlist pop-in" style="--i:3">${rows.map(r => `<div><small>${r[0]}</small><p>${esc(r[1])}</p></div>`).join('')}</div>
          <button class="btn btn-light" data-act="stage">${ef ? 'Keep this evidence plan' : 'Keep this test for review'} ${ICON.arrow}</button>
          <button class="textbtn" data-act="evfirst">${ef ? 'Return to the trial' : 'Not enough evidence yet'}</button>
          <p class="fine center">A draft plan. Real changes need the people involved to agree.</p>
        </section>`;
    };

    const VIEWS = { explore, evidence, test };
    const render = (scrollTop = true) => {
      viewEl.innerHTML = VIEWS[view]();
      $$('.obs-nav [data-view]', el).forEach(b => { b.classList.toggle('on', b.dataset.view === view); b.setAttribute('aria-current', b.dataset.view === view ? 'page' : 'false'); });
      if (scrollTop) el.scrollTo({ top: 0 });
      if (view === 'explore') bindDrag();
    };
    const show = v => { view = v; clearTimeout(replayTimer); render(); const f = $('[data-focus]', viewEl); f && f.focus({ preventScroll: true }); };
    const assign = id => {
      arr.token = id; arr.compare = false; arr.staged = false; arr.evidenceFirst = false;
      save(); buzz(10); render(false);
      toast(id === startOf(o) ? 'First reply returned to the original arrangement' : `First reply moved to ${id === 'cover' ? 'the cover' : P[id].label === 'You' ? 'you' : P[id].label.toLowerCase()}`);
    };
    const replay = () => {
      const t = $('.travel', viewEl);
      if (!t) return;
      t.classList.remove('go'); void t.getBoundingClientRect(); t.classList.add('go');
    };

    function bindDrag() {
      const token = $('#token', viewEl), sys = $('#system', viewEl);
      let drag = null, dragged = false;
      token.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        drag = { x: e.clientX, y: e.clientY, box: sys.getBoundingClientRect(), moved: false };
        dragged = false;
        token.setPointerCapture(e.pointerId);
      });
      token.addEventListener('pointermove', e => {
        if (!drag) return;
        if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 7) { drag.moved = true; token.classList.add('dragging'); }
        if (!drag.moved) return;
        const x = Math.max(6, Math.min(94, (e.clientX - drag.box.left) / drag.box.width * 100));
        const y = Math.max(6, Math.min(94, (e.clientY - drag.box.top) / drag.box.height * 100));
        token.style.left = x + '%'; token.style.top = y + '%';
        $$('.person', sys).forEach(p => {
          const r = $('.orb', p).getBoundingClientRect();
          p.classList.toggle('target', Math.hypot(e.clientX - r.x - r.width / 2, e.clientY - r.y - r.height / 2) < 64);
        });
      });
      const end = e => {
        if (!drag) return;
        dragged = drag.moved;
        const target = drag.moved && $('.person.target', sys);
        drag = null;
        if (target) assign(target.dataset.person); else if (dragged) render(false);
      };
      token.addEventListener('pointerup', end);
      token.addEventListener('pointercancel', () => { drag = null; render(false); });
      token.addEventListener('click', () => { if (!dragged) openSheet('assign'); });
    }

    el.addEventListener('click', e => {
      const nav = e.target.closest('[data-view]');
      if (nav) return show(nav.dataset.view);
      const p = e.target.closest('[data-person]');
      if (p) return assign(p.dataset.person);
      const rit = e.target.closest('[data-rit]');
      if (rit) { store.set('ritual.' + o.id, rit.dataset.rit); buzz(10); return render(false); }
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (!act) return;
      if (act === 'home') go('home', null, -1);
      if (act === 'about') openSheet('about');
      if (act === 'request') openSheet('request');
      if (act === 'compare') { arr.compare = !arr.compare; render(false); replay(); }
      if (act === 'away') { arr.away = !arr.away; arr.staged = false; save(); buzz(8); render(false); replay(); }
      if (act === 'replay') replay();
      if (act === 'try') { arr.compare = false; show('test'); }
      if (act === 'explore') show('explore');
      if (act === 'evfirst') { arr.evidenceFirst = !arr.evidenceFirst; arr.staged = false; save(); render(); }
      if (act === 'stage') { arr.staged = true; save(); render(); toast('Saved for review on this device'); }
      if (act === 'correct') openSheet('correct');
      if (act === 'invite') go('invite');
    });

    obsCtl = {
      people: P, arr: () => arr, start: startOf(o),
      assign: id => { closeSheet(); assign(id); },
      correct: text => { arr.correction = text; arr.staged = false; save(); closeSheet(); render(); toast('Account corrected. Recheck the interpretation.'); },
    };
    render();
    setTimeout(replay, reduced ? 0 : 1200);
  },
};

/* 6 · Invitation --------------------------------------------------- */
function mailto(o) {
  const a = o.answers;
  const L = (k) => LABEL[k][a[k]] || '—';
  const body = [
    `Hello ${BRAND.founder},`,
    '',
    'I completed an observation in the Astervell Observatory and would like to talk about fit for the Workflow Clarity Pilot.',
    '',
    `Workflow: ${L('workflow')}`,
    `Team: ${L('team')}`,
    `Arrives through: ${(a.doors || []).map(d => LABEL.doors[d]).join(', ') || '—'}`,
    `Next step usually sits with: ${L('owner')}`,
    `When they are away: ${L('away')}`,
    `How often it slips: ${L('frequency')}`,
    `How we find out: ${L('signal')}`,
    `Must stay human: ${L('judgment')}`,
    a.note && a.note.trim() ? `In one sentence: ${a.note.trim()}` : null,
    '',
    '(Process description only. No customer records, credentials or files.)',

    o.name ? `— ${o.name}` : '',
  ].filter(x => x !== null).join('\n');
  return `mailto:${BRAND.email}?subject=${encodeURIComponent('Astervell workflow conversation · ' + L('workflow'))}&body=${encodeURIComponent(body)}`;
}

  boundary: () => `

  terms: () => `

      <p>Excludes implementation, software, additional workflows, staff evaluation, regulated data, professional advice and guaranteed results.</p>
      <p>A finding may be that no meaningful change is supported. The quick win is a recommendation to test, not implementation or a promised saving.</p>
    </div>`,
};

const sheetRoot = $('#sheet');
let lastFocus = null;
function openSheet(name) {
  lastFocus = document.activeElement;
  $('#sheet-body').innerHTML = SHEETS[name]();
  sheetRoot.classList.add('open');
  sheetRoot.setAttribute('aria-hidden', 'false');
  $('.sheet', sheetRoot).scrollTop = 0;
  const title = $('#sheet-title');
  title.setAttribute('tabindex', '-1');
  setTimeout(() => title.focus({ preventScroll: true }), 80);
}
function closeSheet() {
  if (!sheetRoot.classList.contains('open')) return;
  sheetRoot.classList.remove('open');
  sheetRoot.setAttribute('aria-hidden', 'true');
  lastFocus && lastFocus.focus && lastFocus.focus({ preventScroll: true });
}
sheetRoot.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) closeSheet();
  const who = e.target.closest('[data-assign]');
  if (who && obsCtl) obsCtl.assign(who.dataset.assign);
  if (e.target.closest('[data-act="forget"]')) {
    try { Object.keys(localStorage).filter(k => k.startsWith('astervell.observatory.')).forEach(k => localStorage.removeItem(k)); } catch (err) {}
    state.obs = null; state.count = 0; state.answers = {};
    go('arrival', null, -1);
  }
});
// Drag the sheet down to dismiss
(() => {
  const sheet = $('.sheet', sheetRoot);
  let y0 = null, dy = 0;
  sheet.addEventListener('touchstart', e => { if (sheet.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; } }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if (dy > 0) { sheet.style.transition = 'none'; sheet.style.transform = `translateY(${dy}px)`; }
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (y0 === null) return;
    sheet.style.transition = ''; sheet.style.transform = '';
    if (dy > 110) closeSheet();
    y0 = null;
  });
})();
sheetRoot.addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#correction', sheetRoot)?.value.trim();
  if (v && obsCtl) obsCtl.correct(v);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

paintSky();

$('#app').addEventListener('scroll', e => { e.currentTarget.scrollTop = 0; e.currentTarget.scrollLeft = 0; });
go('arrival');
})();
